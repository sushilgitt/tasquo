name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 06:00 UTC. Well inside Supabase's inactivity window.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Ping Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/keep-alive.mjs
